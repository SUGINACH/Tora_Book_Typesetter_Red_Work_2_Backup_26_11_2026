name: rebuild-bundles
on:
  push:
    branches: [ engine/legacy-parity-preview-20261119 ]
# A rebuild from a newer commit supersedes stale queued/running bundle builds.
# The current run always rebuilds both deterministic bundles from its own checkout.
concurrency:
  group: rebuild-bundles-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild deterministic bundles (D-65)
        run: node tools/build-worker-bundle.js
      - name: Commit rebuilt bundles when changed
        run: |
          git config user.name "red-ci-bundler"
          git config user.email "bundler@users.noreply.github.com"
          git add red-build/ui/app.bundle.js red-build/ui/engine-worker.bundle.js
          if git diff --cached --quiet; then
            echo "bundles already up to date"
          else
            git commit -m "build: rebuild browser bundles for engine source change (D-65)"
            git push
          fi
      - name: Install Poppler + DejaVu
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - name: Full test suite (with readable failure annotations)
        run: |
          cd red-build
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            grep -nE "FAIL|✗|failed" /tmp/test.log | head -n 4 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-500)
              echo "::error title=Test failure::$msg"
            done
            tail -n 6 /tmp/test.log | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-500)
              echo "::error title=Log tail::$msg"
            done
            exit 1
          fi
